<title>Тренинг навыков DBT</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Unbounded:wght@500;600&family=Onest:wght@400;500;600&display=swap">
<style>
/* Layout: one phone-width column, calm "after the storm" sky palette, bottom tab bar */
:root{
  --bg:#EDF1F2; --card:#FFFFFF; --ink:#1D2A31; --muted:#5E6E76; --line:#D6DEE1;
  --accent:#2C6E73; --accent-soft:#DCEBEB; --done:#C27A3E; --done-soft:#F5E6D8;
  --display:"Unbounded", "Trebuchet MS", sans-serif;
  --body:"Onest", system-ui, -apple-system, "Segoe UI", sans-serif;
  color-scheme:light;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#141C20; --card:#1C272C; --ink:#E5ECEE; --muted:#93A4AB; --line:#2E3C42;
  --accent:#6DB3B6; --accent-soft:#213A3D; --done:#E3A26A; --done-soft:#3A2C20; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#141C20; --card:#1C272C; --ink:#E5ECEE; --muted:#93A4AB; --line:#2E3C42;
  --accent:#6DB3B6; --accent-soft:#213A3D; --done:#E3A26A; --done-soft:#3A2C20; color-scheme:dark}
html,body{height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:16px;line-height:1.5}
.wrap{max-width:480px;margin:0 auto;padding-inline:16px;padding-block:20px 110px;display:flex;flex-direction:column;gap:16px}
h1,h2{font-family:var(--display);font-weight:600;text-wrap:balance;margin:0;letter-spacing:-.01em}
h1{font-size:1.3rem;line-height:1.25}
h2{font-size:1rem}
p{margin:0}
.eyebrow{font-size:.75rem;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);font-weight:600}
.muted{color:var(--muted);font-size:.9rem}
.card{background:var(--card);border-radius:16px;padding:16px;display:flex;flex-direction:column;gap:10px}
.hero{background:var(--accent);color:#fff;border-radius:20px;padding:20px;display:flex;flex-direction:column;gap:8px}
.hero .eyebrow{color:rgba(255,255,255,.78)}
.hero .read{font-size:.9rem;color:rgba(255,255,255,.9)}
.hero .bar{height:6px;background:rgba(255,255,255,.25);border-radius:3px;overflow:hidden}
.hero .bar i{display:block;height:100%;background:#fff;border-radius:3px}
.quote{font-size:1.05rem;font-weight:500;border-left:3px solid var(--accent);padding-left:12px}
.check{display:flex;align-items:center;gap:12px;padding:12px;border-radius:12px;border:1px solid var(--line);background:transparent;color:var(--ink);font:inherit;text-align:left;cursor:pointer;width:100%}
.check .box{width:26px;height:26px;border-radius:8px;border:2px solid var(--line);flex:none;display:grid;place-items:center;font-weight:700;color:transparent}
.check .ltr{font-family:var(--display);color:var(--done);margin-right:4px}
.check.on{border-color:var(--done);background:var(--done-soft)}
.check.on .box{background:var(--done);border-color:var(--done);color:#fff}
.btn{background:var(--accent);color:#fff;border:0;border-radius:12px;padding:14px;font:inherit;font-weight:600;cursor:pointer}
.btn:disabled{opacity:.45;cursor:default}
.btn.ghost{background:var(--accent-soft);color:var(--accent)}
button:focus-visible,input:focus-visible,textarea:focus-visible{outline:3px solid var(--done);outline-offset:2px}
.privacy{display:flex;gap:10px;align-items:flex-start;font-size:.85rem;color:var(--muted);background:var(--accent-soft);border-radius:12px;padding:12px}
.module{display:flex;flex-direction:column;gap:6px}
.sess{display:grid;grid-template-columns:44px 1fr;gap:10px;align-items:start;padding:10px;border-radius:12px;background:var(--card);border:0;font:inherit;color:var(--ink);text-align:left;cursor:pointer;width:100%}
.sess .n{font-family:var(--display);font-size:.85rem;color:var(--muted);font-variant-numeric:tabular-nums;padding-top:2px}
.sess.cur{outline:2px solid var(--accent)}
.sess.past .n{color:var(--done)}
.sess .q{display:none;font-size:.9rem;color:var(--muted);margin-top:4px}
.sess.open .q{display:block}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{border:1px solid var(--line);background:transparent;color:var(--ink);border-radius:999px;padding:7px 12px;font:inherit;font-size:.9rem;cursor:pointer}
.chip.on{background:var(--accent);border-color:var(--accent);color:#fff}
label{font-weight:500;font-size:.95rem}
input[type=range]{width:100%;accent-color:var(--accent)}
.scale{display:flex;justify-content:space-between;font-size:.75rem;color:var(--muted);font-variant-numeric:tabular-nums}
textarea{width:100%;box-sizing:border-box;min-height:80px;border:1px solid var(--line);border-radius:12px;background:var(--bg);color:var(--ink);font:inherit;padding:10px;resize:vertical}
.entry{display:flex;flex-direction:column;gap:4px;padding-block:10px;border-top:1px solid var(--line)}
.entry:first-of-type{border-top:0}
.skill{display:flex;flex-direction:column;gap:6px}
.skill h2{color:var(--accent)}
.skill ul{margin:0;padding-left:0;list-style:none;display:flex;flex-direction:column;gap:4px}
.skill li b{font-family:var(--display);font-weight:600;color:var(--done);margin-right:6px}
.tabs-filter{display:flex;gap:8px;overflow-x:auto;padding-bottom:2px}
.tabs-filter .chip{white-space:nowrap}
.tablewrap{overflow-x:auto}
table{border-collapse:collapse;width:100%;font-size:.9rem}
th,td{padding:8px 6px;text-align:center;border-bottom:1px solid var(--line);font-variant-numeric:tabular-nums}
th:first-child,td:first-child{text-align:left}
th{font-size:.75rem;color:var(--muted);font-weight:600}
.dot{display:inline-grid;place-items:center;width:30px;height:24px;border-radius:7px;font-size:.75rem;font-weight:700}
.dot.y{background:var(--done);color:#fff}
.dot.p{background:var(--done-soft);color:var(--done)}
.dot.n{background:var(--line);color:var(--muted)}
.stat{display:flex;gap:12px}
.stat div{flex:1;background:var(--bg);border-radius:12px;padding:10px}
.stat b{font-family:var(--display);font-size:1.3rem;display:block}
.badge{font-size:.7rem;background:var(--done-soft);color:var(--done);border-radius:6px;padding:2px 6px;font-weight:600;vertical-align:middle}
.codes{font-variant-numeric:tabular-nums}
nav{position:fixed;left:0;right:0;bottom:0;background:var(--card);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px)}
nav .in{max-width:480px;margin:0 auto;display:grid;grid-template-columns:repeat(5,1fr)}
.grid-wrap{overflow-x:auto;background:var(--card);border-radius:16px;padding-block:8px}
.grid{border-collapse:separate;border-spacing:3px;font-size:.8rem;width:max-content}
.grid th,.grid td{padding:0;border:0;text-align:center}
.grid th.sk{position:sticky;left:0;background:var(--card);z-index:1;text-align:left;width:118px;min-width:118px;padding-inline:8px 4px}
.grid .sk button{background:none;border:0;font:inherit;color:var(--ink);text-align:left;cursor:pointer;padding:2px 0;line-height:1.2;width:100%}
.grid .sk button.sel{color:var(--accent);font-weight:600}
.grid .sk small{color:var(--muted);display:block;font-size:.7rem;font-variant-numeric:tabular-nums}
.grid th.wk{font-size:.7rem;color:var(--muted);font-weight:600;font-variant-numeric:tabular-nums;width:24px}
.grid th.wk.cur{color:#fff;background:var(--accent);border-radius:6px}
.grid .modrow th{font-size:.7rem;text-transform:uppercase;letter-spacing:.06em;color:var(--accent);padding-top:12px;padding-bottom:2px}
.cell{width:24px;height:24px;border-radius:6px;border:1px solid var(--line);background:transparent;padding:0;cursor:pointer;display:block}
.cell.pre{background:var(--bg);border-color:var(--bg)}
.cell.on{background:var(--done);border-color:var(--done)}
td.cur .cell:not(.on){border-color:var(--accent)}
.chain{display:flex;flex-direction:column;margin-left:6px}
.link{position:relative;padding:4px 0 10px 20px;border-left:2px solid var(--line)}
.link:last-child{border-left-color:transparent}
.link::before{content:"";position:absolute;left:-7px;top:7px;width:12px;height:12px;border-radius:50%;background:var(--accent)}
.link.vuln::before{background:var(--muted)}
.link.beh::before{background:var(--done)}
.link small{display:block;font-size:.7rem;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);font-weight:600}
.lrow{display:flex;flex-direction:column;gap:8px;padding:12px;border:1px solid var(--line);border-radius:12px}
.lrow .chip{font-size:.8rem;padding:5px 10px}
.lnum{font-family:var(--display);font-size:.8rem;color:var(--accent)}
.seg{display:grid;grid-template-columns:1fr 1fr;background:var(--card);border-radius:12px;padding:4px;gap:4px}
.seg button{border:0;background:transparent;color:var(--muted);font:inherit;font-weight:500;padding:10px;border-radius:9px;cursor:pointer}
.seg button[aria-selected="true"]{background:var(--accent);color:#fff}
.legend{display:flex;flex-wrap:wrap;gap:12px;font-size:.8rem;color:var(--muted)}
.legend span{display:flex;align-items:center;gap:6px}
.legend i{width:14px;height:14px;border-radius:4px;border:1px solid var(--line);display:inline-block}
nav button{background:none;border:0;font:inherit;font-size:.72rem;color:var(--muted);padding:10px 2px 12px;display:flex;flex-direction:column;align-items:center;gap:3px;cursor:pointer}
nav button svg{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
nav button[aria-current="page"]{color:var(--accent);font-weight:600}
.toast{position:fixed;left:50%;bottom:90px;transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:12px;font-size:.9rem;opacity:0;transition:opacity .25s;pointer-events:none;max-width:calc(100% - 32px)}
.toast.show{opacity:1}
@media (prefers-reduced-motion:reduce){.toast{transition:none}}
</style>

<main class="wrap" id="app"></main>

<nav aria-label="Разделы"><div class="in">
  <button data-tab="today" aria-current="page"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>Сегодня</button>
  <button data-tab="plan"><svg viewBox="0 0 24 24"><path d="M4 5h16M4 12h16M4 19h10"/></svg>План</button>
  <button data-tab="diary"><svg viewBox="0 0 24 24"><path d="M6 3h11a1 1 0 0 1 1 1v17l-6-3-6 3V4a1 1 0 0 1 1-1z"/></svg>Дневник</button>
  <button data-tab="skills"><svg viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="16" rx="2"/><path d="M7 9h10M7 13h6"/></svg>Навыки</button>
  <button data-tab="group"><svg viewBox="0 0 24 24"><circle cx="9" cy="8" r="3"/><circle cx="17" cy="9" r="2.5"/><path d="M3 20c0-3.3 2.7-6 6-6s6 2.7 6 6M15 14.5c3 0 6 2 6 5.5"/></svg>Группа</button>
</div></nav>
<div class="toast" id="toast" role="status"></div>

<script>
// Первая группа: по средам в 18:00, первая встреча 7 октября 2026
// Переносы: номер сессии -> новая дата; все следующие встречи идут через неделю от неё
let overrides=(()=>{try{return JSON.parse(localStorage.getItem("dbt-overrides"))||{}}catch(e){return {}}})();
const sessDate=n=>{let d=overrides[1]?new Date(overrides[1]):new Date(2026,9,7,18,0);for(let i=2;i<=n;i++)d=overrides[i]?new Date(overrides[i]):new Date(d.getFullYear(),d.getMonth(),d.getDate()+7,d.getHours(),d.getMinutes());return d};
const hm=d=>`${String(d.getHours()).padStart(2,"0")}:${String(d.getMinutes()).padStart(2,"0")}`;
const fmtDate=n=>{const d=sessDate(n);try{return d.toLocaleDateString('ru-RU',{weekday:'long',day:'numeric',month:'long'})+', '+hm(d)}catch(e){return d.toDateString()}};
const calcCurrent=()=>{const now=new Date();let c=1;for(let n=1;n<=24;n++)if(now>=sessDate(n))c=n;return c};
const nextSession=()=>{const now=new Date();for(let n=1;n<=24;n++)if(sessDate(n)>now)return n;return 24};
const isoDay=d=>`${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,"0")}-${String(d.getDate()).padStart(2,"0")}`;
let moveOpen=false, mv={n:0,date:"",time:"18:00"};
const shortDate=n=>{const d=sessDate(n);return `${d.getDate()} ${["янв","фев","мар","апр","мая","июн","июл","авг","сен","окт","ноя","дек"][d.getMonth()]}`};
let CURRENT=calcCurrent();

const MODULES = [
  {name:"Осознанность", from:1, to:2},
  {name:"Стрессоустойчивость", from:3, to:8},
  {name:"Осознанность", from:9, to:10},
  {name:"Регуляция эмоций", from:11, to:17},
  {name:"Осознанность", from:18, to:19},
  {name:"Межличностная эффективность", from:20, to:24},
];
const moduleOf=n=>MODULES.find(m=>n>=m.from&&n<=m.to).name;

// Расписание Павла. t — тема, read — чтение по книге Ван Дейк, q — вопрос недели,
// codes — материалы пособия Лайнен (видит только ведущий), task — практика недели
const SESS = {
 1:{t:"Введение в DBT, правила группы и мудрый разум", read:"Введение и глава 1", q:"В какой момент недели я жил на автопилоте?", codes:"О1–О4, Ос1–Ос4",
   task:{title:"Наблюдение и мудрый разум", intro:"Каждый день найдите минуту, чтобы просто понаблюдать и спросить свой мудрый разум.", steps:[["","Наблюдал","заметил звуки, ощущения, мысли без ярлыков"],["","Нашёл мудрый разум","спросил себя: что я знаю, когда спокоен?"]]}},
 2:{t:"Навыки осознанности «что» и «как»", read:"Глава 1", q:"Какие суждения о себе я заметил за неделю?", codes:"Ос4, Ос5",
   task:{title:"Навыки «что» и «как»", intro:"Выберите обычное дело (еда, дорога, разговор) и проживите его осознанно.", steps:[["","Наблюдал","замечал, не вмешиваясь"],["","Описывал","называл словами только факты"],["","Участвовал","полностью включился в дело"],["","Безоценочно","без «хорошо» и «плохо»"],["","Однонаправленно","делал одно дело за раз"],["","Эффективно","делал то, что работает"]]}},
 3:{t:"Введение в стрессоустойчивость: СТОП, «за» и «против»", read:"Глава 8", q:"Что я обычно делаю в кризисе и что из этого делает хуже?", codes:"С1–С5",
   task:{title:"Практика навыка СТОП", intro:"Хотя бы два раза за неделю остановитесь по шагам СТОП, когда эмоции толкают действовать сразу.", steps:[["С","Стойте","замер, не стал действовать сразу"],["Т","Только шаг назад","пауза, глубокий вдох"],["О","Осмотритесь","заметил мысли, чувства, что вокруг"],["П","Попытайтесь действовать осознанно","выбрал, что поможет, а не навредит"],["","«За» и «против»","взвесил, к чему приведёт порыв и к чему терпение"]]}},
 4:{t:"Навыки ТРУД: быстро успокоить тело", read:"Глава 8", q:"Как моё тело подаёт сигнал, что эмоций слишком много?", codes:"С6–С6в",
   task:{title:"Практика навыков ТРУД", intro:"Когда эмоции захлёстывают, попробуйте хотя бы один навык ТРУД. Потренируйтесь и в спокойный момент.", steps:[["Т","Температура","прохладная вода на лицо"],["Р","Релаксация","напряг и отпустил мышцы на выдохе"],["У","Упражнения","короткая интенсивная нагрузка"],["Д","Дыхание","медленно, выдох длиннее вдоха"]]}},
 5:{t:"Отвлечение, самоуспокоение и ПОПРАВьте момент", read:"Глава 8", q:"Что уже сейчас помогает мне пережить трудный вечер?", codes:"С7–С9а",
   task:{title:"Пережить трудный момент", intro:"Отметьте, чем вы помогли себе пережить острый момент, не делая хуже.", steps:[["П","Помогите кому-то","сделал что-то хорошее для другого"],["Е","Если сравнить","сравнил с тем, как было раньше"],["Р","Различные эмоции","вызвал другую эмоцию: фильм, музыка"],["Е","Есть другие действия","занял себя делом"],["Ж","Железная стена","мысленно отодвинул ситуацию"],["И","Используйте ощущения","душ, запах, вкус, звук"],["Т","Течение мыслей","переключил мысли: счёт, головоломка"],["","Самоуспокоение","успокоил себя через органы чувств"],["","ПОПРАВьте момент","воображение, смысл, отдых, молитва"]]}},
 6:{t:"Принятие реальности: радикальное принятие", read:"Глава 7", q:"С чем я до сих пор спорю, хотя изменить это не могу?", codes:"С10, С11, С11а",
   task:{title:"Практика радикального принятия", intro:"Выберите небольшую ситуацию, с которой вы спорите, и потренируйтесь её принять.", steps:[["","Заметил непринятие","поймал мысль «так не должно быть»"],["","Признал факт","это уже произошло"],["","Принял телом","расслабил плечи и лицо"],["","Позволил себе грусть","не боролся с чувствами"]]}},
 7:{t:"Поворот сознания, готовность, полуулыбка", read:"Глава 7", q:"Где я проявляю своеволие, а где готовность?", codes:"С11б–С14а",
   task:{title:"Поворот к принятию", intro:"Заметьте, когда разум упирается, и разверните его снова, сколько бы раз ни понадобилось.", steps:[["","Заметил «почему я?!»","поймал момент сопротивления"],["","Повернул сознание","выбрал принять, а не бороться"],["","Готовность","сделал то, что требует ситуация"],["","Полуулыбка","расслабил лицо"],["","Ладони готовности","раскрыл ладони вместо кулаков"]]}},
 8:{t:"Осознанность к текущим мыслям", read:"Глава 7", q:"Какая мысль чаще всего крутится у меня в голове?", codes:"С15, С15а",
   task:{title:"Наблюдать мысли", intro:"Потренируйтесь видеть мысли как мысли, а не как факты. В конце недели составьте свой кризисный план.", steps:[["","Заметил мысль","назвал её: «это мысль»"],["","Отпустил","как облако или вагон поезда"],["","Не подавлял","дал мысли прийти и уйти"],["","Кризисный план","записал навыки, которые мне помогают"]]}},
 9:{t:"Мудрый разум и навыки «что»", read:"Глава 4", q:"Когда на этой неделе я слышал свой мудрый разум?", codes:"О1, О3–О4, Ос1–Ос4",
   task:{title:"Мудрый разум и «что»", intro:"Каждый день немного практики: наблюдать, описывать, участвовать.", steps:[["","Мудрый разум","нашёл точку равновесия через дыхание"],["","Наблюдал","без слов и ярлыков"],["","Описывал","только факты"],["","Участвовал","растворился в деле"]]}},
 10:{t:"Описание, участие и навыки «как»", read:"Глава 4", q:"Какое оценочное слово я чаще всего говорю о себе?", codes:"Ос4, Ос5",
   task:{title:"Без оценок", intro:"Ловите оценочные слова и переводите их в факты и чувства.", steps:[["","Поймал оценку","«ужасно», «глупо», «плохой»"],["","Заменил фактом","описал, что произошло"],["","Однонаправленно","одно дело за раз"],["","Эффективно","выбрал то, что работает, а не «кто прав»"]]}},

function viewPlan(){

  MODULES.map(m=>{let rows="";for(let i=m.from;i<=m.to;i++){const s=SESS[i],st=i<CURRENT?"past":i===CURRENT?"cur":"";
    rows+=`<button class="sess ${st}" data-sess="${i}"><span class="n">${i<CURRENT?"✓ ":""}${i}</span><span><span class="muted">${shortDate(i)}</span><br><span>${s.t}</span><span class="q">Читаем: ${s.read}<br>Вопрос: ${s.q}<br>Задание: ${s.task.title}${answers[i]?`<br><b>Мой ответ:</b> ${esc(answers[i])}`:""}${i!==CURRENT?`<br><span class="chip" data-goto="${i}" style="display:inline-block;margin-top:6px">Сделать текущей</span>`:""}</span></span></button>`}
  return `<section class="module"><span class="eyebrow">${m.name} · сессии ${m.from}–${m.to}</span>${rows}</section>`}).join("");
}

function chainView(c){

  return `<div class="chain">
    ${L("vuln","Уязвимость",[...c.vuln,c.vnote].filter(Boolean).join(", "))}
    ${L("","Событие",c.event)}
    ${c.links.filter(l=>l.text.trim()).map(l=>L("",l.type,l.text)).join("")}
    ${L("beh","Поведение",c.beh)}
    ${L("vuln","Последствия",[c.shortC,c.longC].filter(Boolean).join(" · "))}
  </div>`;
}

    <div class="tablewrap"><table><thead><tr><th>Участник</th>${sess.map(n=>`<th>Сессия ${n}</th>`).join("")}</tr></thead>
    <tbody>${PEOPLE.map(p=>`<tr><td>${p[0]}</td>${sess.map((n,i)=>`<td>${cell(p[i+1+(3-sess.length)])}</td>`).join("")}</tr>`).join("")}</tbody></table></div>
    <p class="muted">Число в ячейке — сколько из четырёх отметок отправил участник: дневник, задание, разбор цепочки, глава. Имена и данные здесь примерные.</p>
  </section>
  ${privacy("На этом экране только галочки. Эмоции, ответы и записи дневника сюда не попадают.")}`;
}

function render(){
  const v={today:viewToday,plan:viewPlan,diary:viewDiary,skills:viewSkills,group:viewGroup,form:viewForm,chain:viewChain}[tab];
  $("#app").innerHTML=v();
  document.querySelectorAll("nav button").forEach(b=>b.setAttribute("aria-current",b.dataset.tab===tab?"page":"false"));
}
document.addEventListener("click",e=>{
  const g=e.target.closest("[data-goto]");
  if(g){CURRENT=+g.dataset.goto;fd=emptyForm();editAns=false;ansDraft="";marks={diary:false,hw:false,chain:false,read:false,sent:false};skillFilter=null;tab="today";render();window.scrollTo(0,0);toast(`Текущая сессия: ${CURRENT}`);return}
  const b=e.target.closest("button");if(!b)return;
  if(b.dataset.tab){tab=b.dataset.tab;render();window.scrollTo(0,0);return}
  if(b.dataset.mark){marks[b.dataset.mark]=!marks[b.dataset.mark];marks.sent=false;store.set("dbt-marks3",marks);render();return}
  if(b.id==="send"){marks.sent=true;store.set("dbt-marks3",marks);render();toast("Отметки отправлены ведущему");return}
  if(b.id==="save-ans"){if(!ansDraft.trim()){toast("Сначала напишите ответ");return}answers[CURRENT]=ansDraft.trim();store.set("dbt-answers",answers);editAns=false;render();toast("Ответ сохранён на этом телефоне");return}
  if(b.id==="edit-ans"){editAns=true;ansDraft=answers[CURRENT]||"";render();document.getElementById("ans").focus();return}
  if(b.dataset.step){const t=b.dataset.step,order=SESS[CURRENT].task.steps.map(x=>x[1]);fd.steps=fd.steps.includes(t)?fd.steps.filter(x=>x!==t):[...fd.steps,t].sort((a,c)=>order.indexOf(a)-order.indexOf(c));render();return}
  if(b.dataset.res){fd.res=fd.res===b.dataset.res?"":b.dataset.res;render();return}
  if(b.id==="save-form"){
    if(!fd.sit.trim()){toast("Опишите ситуацию в первом пункте");document.getElementById("sit").focus();return}
    (practices[CURRENT]=practices[CURRENT]||[]).unshift({...fd,sit:fd.sit.trim(),date:today()});
    store.set("dbt-practices2",practices);fd=emptyForm();
    if(!marks.hw){marks.hw=true;marks.sent=false;store.set("dbt-marks3",marks)}
    render();toast("Практика сохранена на этом телефоне");return}
  if(b.id==="mv-open"){const n=nextSession();const d=sessDate(n);mv={n,date:isoDay(new Date(d.getFullYear(),d.getMonth(),d.getDate()+7)),time:hm(d)};moveOpen=true;render();return}
  if(b.id==="mv-cancel"){moveOpen=false;render();return}
  if(b.id==="mv-save"){if(!mv.date){toast("Выберите новую дату");return}overrides[mv.n]=`${mv.date}T${mv.time||"18:00"}`;try{localStorage.setItem("dbt-overrides",JSON.stringify(overrides))}catch(e){}CURRENT=calcCurrent();moveOpen=false;render();toast(`Сессия ${mv.n} перенесена, следующие встречи сдвинуты`);return}
  if(b.dataset.unmove){delete overrides[b.dataset.unmove];try{localStorage.setItem("dbt-overrides",JSON.stringify(overrides))}catch(e){}CURRENT=calcCurrent();render();toast("Перенос отменён");return}
  if(b.id==="chain-toggle"){chainOn=!chainOn;store.set("dbt-chain-on",chainOn);render();toast(chainOn?"Разбор цепочки включён для группы":"Разбор цепочки выключен");return}
  if(b.dataset.smode){skillsMode=b.dataset.smode;render();return}
  if(b.dataset.vuln){const v=b.dataset.vuln;cd.vuln=cd.vuln.includes(v)?cd.vuln.filter(x=>x!==v):[...cd.vuln,v];render();return}
  if(b.dataset.chsk){const v=b.dataset.chsk;cd.skills=cd.skills.includes(v)?cd.skills.filter(x=>x!==v):[...cd.skills,v];render();return}
  if(b.dataset.ltype){const [i,t]=b.dataset.ltype.split("|");cd.links[+i].type=t;render();return}
  if(b.dataset.lrm){cd.links.splice(+b.dataset.lrm,1);render();return}
  if(b.id==="add-link"){cd.links.push({type:"Мысль",text:""});render();const t=document.querySelectorAll("[data-ltext]");t[t.length-1]&&t[t.length-1].focus();return}
  if(b.id==="save-chain"){
    if(!cd.beh.trim()||!cd.event.trim()){toast("Заполните хотя бы первые два пункта");document.getElementById(cd.beh.trim()?"ch-event":"ch-beh").focus();return}
    (chains[CURRENT]=chains[CURRENT]||[]).unshift({...cd,links:cd.links.filter(l=>l.text.trim()),date:today()});
    store.set("dbt-chains",chains);cd=emptyChain();
    if(!marks.chain){marks.chain=true;marks.sent=false;store.set("dbt-marks3",marks)}
    render();window.scrollTo(0,document.body.scrollHeight);toast("Разбор сохранён на этом телефоне");return}
  if(b.dataset.cell){const [n,w]=b.dataset.cell.split("|"),wk=+w,a=grid[n]||[];grid[n]=a.includes(wk)?a.filter(x=>x!==wk):[...a,wk];store.set("dbt-grid2",grid);
    const sx=b.closest(".grid-wrap").scrollLeft;render();const gw=document.querySelector(".grid-wrap");if(gw)gw.scrollLeft=sx;return}
  if(b.dataset.gskill){gridSel=gridSel===b.dataset.gskill?null:b.dataset.gskill;const sx=document.querySelector(".grid-wrap").scrollLeft;render();document.querySelector(".grid-wrap").scrollLeft=sx;window.scrollTo({top:0,behavior:"smooth"});return}
  if(b.dataset.sess){b.classList.toggle("open");return}
  if(b.dataset.mod){skillFilter=b.dataset.mod;render();return}
  if(b.dataset.em||b.dataset.sk){const k=b.dataset.em?"em":"sk",v=b.dataset.em||b.dataset.sk;draft[k]=draft[k].includes(v)?draft[k].filter(x=>x!==v):[...draft[k],v];render();return}
  if(b.id==="save"){
    diary.unshift({date:today(),em:draft.em,power:draft.power,sk:draft.sk,note:draft.note.trim()});
    draft.sk.forEach(n=>{const a=grid[n]||[];if(!a.includes(CURRENT))grid[n]=[...a,CURRENT]});store.set("dbt-grid2",grid);
    store.set("dbt-diary",diary);draft={em:[],sk:[],power:2,note:""};
    if(!marks.diary){marks.diary=true;marks.sent=false;store.set("dbt-marks3",marks)}
    render();toast("Запись сохранена на этом телефоне");
  }
});
document.addEventListener("input",e=>{
  const id=e.target.id;
  if(id==="mv-n")mv.n=+e.target.value;
  if(id==="mv-date")mv.date=e.target.value;
  if(id==="mv-time")mv.time=e.target.value;
  if(id==="power"){draft.power=+e.target.value;$("#power-v").textContent=e.target.value}
  if(id==="note")draft.note=e.target.value;
  if(id==="ans")ansDraft=e.target.value;
  if(id==="sit")fd.sit=e.target.value;
  if(id==="did")fd.did=e.target.value;
  if(id==="fnote")fd.note=e.target.value;
  const cmap={"ch-beh":"beh","ch-event":"event","ch-vnote":"vnote","ch-short":"shortC","ch-long":"longC","ch-snote":"snote","ch-repair":"repair","ch-prevent":"prevent"};
  if(cmap[id])cd[cmap[id]]=e.target.value;
  if(e.target.dataset&&e.target.dataset.ltext!==undefined)cd.links[+e.target.dataset.ltext].text=e.target.value;
  if(id==="before"||id==="after"){fd[id]=+e.target.value;$("#"+id+"-v").textContent=e.target.value}
});
render();
</script>
